<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تأكيد رمز التحقق | شركة رواد</title>

  <!-- Google Fonts: Cairo & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    /* CSS System - Official Corporate Ruwad Theme */
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --primary: #1e3a8a;       /* Navy Corporate Blue */
      --primary-hover: #1e40af;
      --accent: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-focus: #2563eb;
      --error-color: #dc2626;
      --success-color: #16a34a;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-card: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* Google Material Symbols Adjustments */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
      user-select: none;
    }

    /* Official Card Container */
    .ruwad-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-card);
      text-align: center;
    }

    /* Brand Header */
    .ruwad-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 1.75rem;
    }

    .ruwad-logo-icon {
      width: 42px;
      height: 42px;
      background-color: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      padding: 8px;
    }

    .ruwad-logo-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .ruwad-title-group {
      text-align: right;
    }

    .ruwad-brand-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
    }

    .ruwad-brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Title & Description */
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .card-desc strong {
      color: var(--text-main);
      direction: ltr;
      display: inline-block;
    }

    /* 6-Digit OTP Fields Group */
    .otp-inputs-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      direction: ltr;
      margin-bottom: 1.5rem;
    }

    .otp-box {
      width: 46px;
      height: 54px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background-color: #ffffff;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      outline: none;
      transition: all 0.2s ease-in-out;
      box-shadow: var(--shadow-sm);
    }

    /* Input States */
    .otp-box:hover {
      border-color: #cbd5e1;
    }

    .otp-box:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      background-color: #f8fafc;
    }

    .otp-box.filled {
      border-color: var(--accent);
      background-color: #eff6ff;
    }

    /* Submit / Verify Button */
    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      border-radius: 10px;
      border: none;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    /* Resend Link Section */
    .resend-container {
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .resend-btn {
      color: var(--accent);
      font-weight: 700;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-size: 0.875rem;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .resend-btn:hover:not(:disabled) {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .resend-btn:disabled {
      color: #94a3b8;
      cursor: not-allowed;
      text-decoration: none;
    }

    /* Status Notifications */
    .status-alert {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .status-alert.error {
      display: flex;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--error-color);
    }

    .status-alert.success {
      display: flex;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: var(--success-color);
    }

    /* EmailJS Configuration Panel (Official Admin Toggle) */
    .emailjs-panel {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      text-align: right;
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      margin-bottom: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      background-color: #f8fafc;
    }

    .panel-input:focus {
      border-color: var(--accent);
      background-color: #ffffff;
    }

    .btn-secondary {
      width: 100%;
      padding: 0.65rem;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background-color: #f1f5f9;
    }

    /* Responsiveness for Mobile Devices */
    @media (max-width: 480px) {
      .ruwad-card {
        padding: 2rem 1.25rem;
        border-radius: 12px;
      }
      .otp-inputs-wrapper {
        gap: 5px;
      }
      .otp-box {
        width: 40px;
        height: 48px;
        font-size: 1.15rem;
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Official Ruwad OTP Card Container -->
  <div class="ruwad-card">

    <!-- Ruwad Corporate Header -->
    <div class="ruwad-header">
      <div class="ruwad-logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 79.99 77.99">
          <path d="M14.59,22.73h15.6l11.03,12.14h2.67c9.02,0,13.59-5.68,13.59-11.47s-4.57-11.59-13.59-11.59H9.8L0,0h46.35c16.93,0,25.29,11.7,25.29,23.28,0,10.47-6.68,20.95-20.17,23.06l28.52,31.64h-17.16l-27.3-31.31H14.15v31.31H.56v-43.12h24.73l-10.7-12.14Z"/>
        </svg>
      </div>
      <div class="ruwad-title-group">
        <div class="ruwad-brand-name">شركة رواد</div>
        <div class="ruwad-brand-sub">RUWAD COMPANY</div>
      </div>
    </div>

    <!-- Title & Description -->
    <h1 class="card-title">تأكيد رمز التحقق (OTP)</h1>
    <p class="card-desc">
      تم إرسال رمز الأمان المكون من 6 أرقام إلى البريد الإلكتروني:<br>
      <strong id="displayEmail">user@ruwad.com</strong>
    </p>

    <!-- 6-Digit OTP Input Fields -->
    <div class="otp-inputs-wrapper" id="otpGroup">
      <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autofocus autocomplete="off">
      <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
      <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
      <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
      <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
      <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
    </div>

    <!-- Submit Button with Google Material Symbol Icon -->
    <button class="btn-submit" id="btnSubmit" onclick="verifyOTPCode()">
      <span class="material-symbols-outlined">verified_user</span>
      <span>تأكيد الرمز</span>
    </button>

    <!-- Status Alert Bar -->
    <div class="status-alert" id="statusAlert">
      <span class="material-symbols-outlined" id="statusIcon">info</span>
      <span id="statusText"></span>
    </div>

    <!-- Resend Countdown Timer -->
    <div class="resend-container">
      لم يصلك كود التحقق؟ 
      <button class="resend-btn" id="btnResend" onclick="handleResend()" disabled>
        <span class="material-symbols-outlined" style="font-size: 18px;">refresh</span>
        <span>إعادة الإرسال (<span id="timerCount">60</span> ثانية)</span>
      </button>
    </div>

    <!-- EmailJS Integration Controls -->
    <div class="emailjs-panel">
      <div class="panel-title">
        <span class="material-symbols-outlined" style="font-size: 18px;">mail</span>
        <span>تجربة إرسال البريد عبر EmailJS</span>
      </div>
      <input type="email" class="panel-input" id="targetEmailInput" value="user@ruwad.com" placeholder="أدخل البريد المستهدف..." oninput="document.getElementById('displayEmail').innerText = this.value">
      <button class="btn-secondary" onclick="sendOTPEmailJS()">
        <span class="material-symbols-outlined" style="font-size: 18px;">send</span>
        <span>إرسال كود جديد للإيميل</span>
      </button>
    </div>

  </div>

  <!-- JavaScript Logic -->
  <script>
    // System Variables
    let generatedOTP = "123456"; // Default testing OTP
    let timerValue = 60;
    let timerInterval = null;

    // EmailJS Public API Keys (Set your EmailJS credentials here)
    const EMAILJS_CONFIG = {
      publicKey: "YOUR_PUBLIC_KEY",
      serviceId: "YOUR_SERVICE_ID",
      templateId: "YOUR_TEMPLATE_ID"
    };

    // Initialize EmailJS if public key is provided
    if (typeof emailjs !== 'undefined' && EMAILJS_CONFIG.publicKey !== "YOUR_PUBLIC_KEY") {
      emailjs.init(EMAILJS_CONFIG.publicKey);
    }

    // OTP Inputs DOM Handling (Auto-Advance, Backspace, Paste)
    const otpBoxes = document.querySelectorAll('.otp-box');

    otpBoxes.forEach((box, index) => {
      // Keyup navigation
      box.addEventListener('keyup', (e) => {
        const val = box.value;
        if (val.length === 1) {
          box.classList.add('filled');
          if (index < otpBoxes.length - 1) {
            otpBoxes[index + 1].focus();
          }
        }

        if (e.key === 'Backspace') {
          box.classList.remove('filled');
          if (index > 0 && val === '') {
            otpBoxes[index - 1].focus();
          }
        }
      });

      // Filter non-numeric characters
      box.addEventListener('input', () => {
        box.value = box.value.replace(/[^0-9]/g, '');
      });

      // Paste 6-digit OTP code directly
      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedText = (e.clipboardData || window.clipboardData).getData('text').trim();
        if (/^\d{6}$/.test(pastedText)) {
          pastedText.split('').forEach((char, idx) => {
            if (otpBoxes[idx]) {
              otpBoxes[idx].value = char;
              otpBoxes[idx].classList.add('filled');
            }
          });
          otpBoxes[5].focus();
        }
      });
    });

    // Helper: Generate Random 6-Digit OTP
    function create6DigitOTP() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    // Send OTP via EmailJS
    async function sendOTPEmailJS() {
      const email = document.getElementById('targetEmailInput').value;
      if (!email || !email.includes('@')) {
        showAlert('يرجى كتابة عنوان بريد إلكتروني صحيح.', 'error', 'error');
        return;
      }

      generatedOTP = create6DigitOTP();
      showAlert(`جاري إرسال كود OTP إلكترونياً إلى ${email}...`, 'success', 'mark_email_read');

      const params = {
        to_email: email,
        user_name: email.split('@')[0],
        otp_code: generatedOTP,
        expiry_minutes: "5",
        company_name: "شركة رواد"
      };

      try {
        if (EMAILJS_CONFIG.publicKey === "YOUR_PUBLIC_KEY") {
          console.log("EmailJS Params:", params);
          showAlert(`كود OTP المولد للتجربة: [ ${generatedOTP} ] (يرجى إضافة مفاتيح EmailJS للتفعيل الفعلي)`, 'success', 'check_circle');
        } else {
          await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, params);
          showAlert(`تم إرسال كود التحقق بنجاح إلى ${email}`, 'success', 'check_circle');
        }
        startTimer();
      } catch (err) {
        console.error("EmailJS Error:", err);
        showAlert('تعذر الإرسال عبر EmailJS: ' + (err.text || err.message || 'تأكد من المفاتيح'), 'error', 'warning');
      }
    }

    // Verify OTP Action
    function verifyOTPCode() {
      let code = "";
      otpBoxes.forEach(b => code += b.value);

      if (code.length < 6) {
        showAlert('يرجى إدخال كافة أرقام الرمز الـ 6.', 'error', 'error');
        return;
      }

      if (code === generatedOTP) {
        showAlert('تم تأكيد الرمز بنجاح! جاري تحويلك...', 'success', 'task_alt');
        document.getElementById('btnSubmit').style.backgroundColor = 'var(--success-color)';
        document.getElementById('btnSubmit').innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>تم التأكيد بنجاح</span>';
      } else {
        showAlert('رمز التحقق غير صحيح، يرجى المحاولة مرة أخرى.', 'error', 'cancel');
      }
    }

    // Show Alert Message
    function showAlert(message, type, iconName) {
      const alertBox = document.getElementById('statusAlert');
      const textEl = document.getElementById('statusText');
      const iconEl = document.getElementById('statusIcon');

      alertBox.className = `status-alert ${type}`;
      textEl.innerText = message;
      iconEl.innerText = iconName;
    }

    // Countdown Timer Logic
    function startTimer() {
      clearInterval(timerInterval);
      timerValue = 60;
      const btnResend = document.getElementById('btnResend');
      const timerSpan = document.getElementById('timerCount');

      btnResend.disabled = true;

      timerInterval = setInterval(() => {
        timerValue--;
        timerSpan.innerText = timerValue;

        if (timerValue <= 0) {
          clearInterval(timerInterval);
          btnResend.disabled = false;
          btnResend.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">refresh</span><span>إعادة الإرسال الآن</span>';
        }
      }, 1000);
    }

    // Resend Trigger
    function handleResend() {
      if (timerValue <= 0) {
        sendOTPEmailJS();
      }
    }

    // Start timer on initial view
    startTimer();
  </script>
</body>
</html>
